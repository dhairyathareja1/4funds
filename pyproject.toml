[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fourfunds"
version = "0.1.0"
description = "A modular quantitative trading bot for the Roostoo university hackathon."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
]

[project.scripts]
fourfunds = "fourfunds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
